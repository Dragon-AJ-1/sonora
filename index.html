<script>
(function(){
  function enhanceRadioPage(){
    if(!window.S || S.page !== 'radio') return;
    var view = document.getElementById('view');
    if(!view || view.querySelector('[data-live-radio]')) return;
    var box = document.createElement('div');
    box.setAttribute('data-live-radio','1');
    box.style.cssText = 'max-width:1440px;margin:0 auto;padding:0 clamp(16px,3.4vw,44px) 24px';
    box.innerHTML = '<button class="btn solid" type="button" id="btnLiveRadio" style="margin-top:8px">▶ Play channel feed</button><div id="radioTicker"></div>';
    var firstSec = view.querySelector('.sec') || view;
    firstSec.parentNode.insertBefore(box, firstSec);
    var btn = document.getElementById('btnLiveRadio');
    if(btn) btn.addEventListener('click', function(){
      if(window.SONORA_RADIO) SONORA_RADIO.start();
      else if(typeof radioPlay === 'function') radioPlay('late');
    });
    if(window.SONORA_RADIO){
      SONORA_RADIO.load().then(function(){ SONORA_RADIO.renderTicker(); });
    }
  }
  var obs = new MutationObserver(function(){ enhanceRadioPage(); });
  obs.observe(document.getElementById('view')||document.body, {childList:true, subtree:true});
  setTimeout(enhanceRadioPage, 800);
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest && e.target.closest('[data-a="like"], [data-a="play-ref"], [data-a="play-album"]');
    if(t && window.SONORA_FORYOU) setTimeout(function(){ SONORA_FORYOU.refresh(); }, 400);
  });
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
